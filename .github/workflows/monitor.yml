name: Booking Monitor

on:
  schedule:
    # Runs every 10 minutes. You can adjust this as needed.
    - cron: '*/5 * * * *'
  # Allows you to manually trigger it from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run booking script
        run: python booking_monitor.py
